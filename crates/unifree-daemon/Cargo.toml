[package]
name = "unifree-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unifreed"
path = "src/main.rs"

[dependencies]
unifree-config = { path = "../unifree-config" }
unifree-state = { path = "../unifree-state" }
unifree-types = { path = "../unifree-types" }
unifree-adopt = { path = "../unifree-adopt" }
unifree-protocol = { path = "../unifree-protocol" }

# Async runtime
tokio.workspace = true

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Networking
socket2.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Config
toml.workspace = true

# Error handling
anyhow.workspace = true

# Time
chrono.workspace = true

# Hex
hex.workspace = true

# Bytes
bytes.workspace = true

# CLI args
clap.workspace = true

sha2 = "0.10.9"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
prometheus.workspace = true
