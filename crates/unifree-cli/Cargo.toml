[package]
name = "unifree-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unifree"
path = "src/main.rs"

[dependencies]
unifree-config = { path = "../unifree-config" }
unifree-state = { path = "../unifree-state" }
unifree-types = { path = "../unifree-types" }
unifree-adopt = { path = "../unifree-adopt" }
unifree-protocol = { path = "../unifree-protocol" }

# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# CLI args
clap.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Time
chrono.workspace = true

reqwest = { version = "0.12.24", features = ["json"] }
