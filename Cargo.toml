[workspace]
resolver = "2"
members = [
    "crates/unifree-protocol",
    "crates/unifree-daemon",
    "crates/unifree-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jonasgrosch/unifree"
authors = ["Jonas Grosch"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"

# Compression
flate2 = "1"

# SSH (pure Rust)
russh = "0.54"
ssh-key = "0.6"  # Required by russh's Handler API

# Networking
socket2 = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
toml = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Hex encoding
hex = "0.4"

# Bytes manipulation
bytes = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
unifree-protocol = { path = "crates/unifree-protocol" }
